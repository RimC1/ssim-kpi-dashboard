<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSIM KPI Dashboard — SIC & SFT MENA</title>
<style>
:root{
  --blue:#1428A0; --navy:#0B1240; --tint:#EEF1FB; --tint2:#E2E8FA;
  --bg:#F6F7FB; --paper:#FFFFFF; --ink:#1A1C23; --mut:#5C6270; --line:#E4E6EC;
  --ok:#0E8A5F; --ok-bg:#E7F4EE; --warn:#B96E00; --warn-bg:#FBF1E0;
  --risk:#C8362B; --risk-bg:#FBEAE8; --idle:#9AA0AC; --idle-bg:#F0F1F4;
  --y1:#9AA0AC; --y2:#5C6FD6; --y3:#1428A0; --y4:#0E8A5F; --y5:#B96E00;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
a{color:var(--blue)}
button,select{font-family:inherit}

/* ---------- app bar ---------- */
.appbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50}
.appbar-inner{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px;height:58px}
.wordmark{font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.wordmark span{color:#8FA3F0;font-weight:500}
.tabs{display:flex;gap:4px;flex:1}
.tab{background:none;border:none;color:#B9C2E8;font-size:14px;font-weight:500;padding:8px 13px;border-radius:6px;cursor:pointer}
.tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab.active{color:#fff;background:var(--blue)}
.tab:focus-visible,.cycle-sel:focus-visible,.rowlink:focus-visible{outline:2px solid #8FA3F0;outline-offset:2px}
.cycle-sel{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:500}
.cycle-sel option{color:var(--ink)}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px}
.page-head{margin-bottom:22px}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.page-head p{color:var(--mut);margin-top:4px;max-width:78ch}
.datasource{font-size:12.5px;color:var(--mut);margin-top:10px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.live{background:var(--ok)} .dot.sample{background:var(--warn)}

.statline{display:flex;gap:40px;flex-wrap:wrap;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:26px}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:13px;color:var(--mut);margin-top:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:22px}
.panel h2{font-size:16px;font-weight:700;margin-bottom:4px}
.panel .sub{font-size:13px;color:var(--mut);margin-bottom:16px}

/* ---------- self-drawn horizontal bars (overview ranking) ---------- */
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:110px 1fr 56px;gap:12px;align-items:center}
.hbar .nm{font-weight:700;font-size:13px;text-align:right}
.hbar .nm button{width:100%;text-align:right}
.hbar .track{height:18px;background:var(--idle-bg);border-radius:4px;position:relative}
.hbar .fillb{position:absolute;left:0;top:0;bottom:0;border-radius:4px;min-width:2px}
.hbar .pc{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}

/* ---------- heat table ---------- */
.heat{width:100%;border-collapse:collapse;font-size:13.5px}
.heat th{text-align:left;font-weight:600;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.heat th.num,.heat td.num{text-align:right}
.heat td{padding:9px 10px;border-bottom:1px solid var(--line)}
.heat tr:last-child td{border-bottom:none}
.rowlink{background:none;border:none;font:inherit;font-weight:700;color:var(--blue);cursor:pointer;padding:0;text-align:left}
.rowlink:hover{text-decoration:underline}
.cellpct{display:inline-block;min-width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;padding:3px 8px;border-radius:5px}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)}
.c-risk{background:var(--risk-bg);color:var(--risk)} .c-idle{background:var(--idle-bg);color:var(--idle)}
.tierchip{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;font-weight:800;font-size:13px;color:#fff}
.t-A{background:var(--ok)} .t-B{background:var(--blue)} .t-C{background:var(--warn)} .t-D{background:var(--risk)}

/* ---------- subsidiary detail ---------- */
.backlink{background:none;border:none;color:var(--mut);font-size:13.5px;cursor:pointer;margin-bottom:14px;padding:0}
.backlink:hover{color:var(--blue)}
.sumband{display:grid;grid-template-columns:minmax(240px,1fr) minmax(260px,340px);gap:28px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px;margin-bottom:24px}
.bigscore{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bigscore small{font-size:24px;color:var(--mut);font-weight:500}
.scoremeta{margin-top:10px;color:var(--mut);font-size:13.5px}
.gaphint{margin-top:14px;font-size:13.5px;background:var(--tint);color:var(--navy);border-radius:7px;padding:9px 12px;display:inline-block}

.pillarsec{margin-bottom:26px}
.pillarsec>h2{font-size:17px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pillarsec>h2 .pw{font-size:13px;color:var(--mut);font-weight:500}
.pillarsec>.pdesc{font-size:13px;color:var(--mut);margin:2px 0 12px}
.kpilist{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.kpirow{display:grid;grid-template-columns:minmax(240px,1.35fr) minmax(200px,1.6fr) 125px;gap:18px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.kpirow:last-child{border-bottom:none}
.kpiname{font-weight:600;font-size:14px}
.kpiq{font-size:11px;color:var(--mut);font-weight:500;background:var(--idle-bg);border-radius:4px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.kpitarget{font-size:12.5px;color:var(--mut);margin-top:2px}
.planline{font-size:12.5px;color:var(--navy);margin-top:5px;padding:6px 9px;background:var(--tint);border-radius:6px}
.planline b{font-weight:700}
.kpicomment{font-size:12.5px;color:var(--mut);margin-top:4px;font-style:italic}
.bullet{position:relative;height:18px;background:var(--idle-bg);border-radius:4px;overflow:visible}
.bullet .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;min-width:2px}
.bullet .tick{position:absolute;right:0;top:-4px;bottom:-4px;width:2.5px;background:var(--navy);border-radius:2px}
.bullet .ticklbl{position:absolute;right:-2px;top:-20px;font-size:10.5px;color:var(--mut);white-space:nowrap}
.f-ok{background:var(--ok)} .f-warn{background:var(--warn)} .f-risk{background:var(--risk)} .f-idle{background:var(--idle)}
.kpistat{text-align:right}
.kpistat .pct{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.kpistat .vt{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.statuschip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:3px}

/* ---------- self-drawn grouped bars (YoY + Compare) ---------- */
.gb-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;font-weight:600}
.gb-legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gb-scroll{overflow-x:auto;padding-bottom:4px;padding-top:18px}
.gb{display:flex;align-items:flex-end;gap:18px;min-height:240px;border-bottom:1px solid var(--line);padding:0 4px}
.gb-group{display:flex;flex-direction:column;align-items:center;flex:1;min-width:58px}
.gb-bars{display:flex;align-items:flex-end;gap:3px;height:200px}
.gb-bar{width:16px;border-radius:3px 3px 0 0;position:relative;min-height:2px}
.gb-val{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--mut);white-space:nowrap}
.gb-lbl{font-size:11.5px;font-weight:600;color:var(--ink);margin-top:7px;text-align:center;line-height:1.25;max-width:92px;word-break:break-word}
.metricbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.metricbar label{font-size:13px;font-weight:600;color:var(--mut)}
.msel{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13.5px;background:#fff;font-weight:600;color:var(--ink)}

/* ---------- radar (SVG) ---------- */
.radarbox{display:flex;justify-content:center}
.radarbox svg{max-width:340px;width:100%;height:auto}

/* ---------- KPI guide ---------- */
.guide{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--paper)}
.guide th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);font-size:12.5px;color:var(--mut)}
.guide td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
code.k{background:var(--tint);color:var(--navy);padding:1px 6px;border-radius:4px;font-size:12px;font-family:ui-monospace,Consolas,monospace}

.note{font-size:13px;color:var(--mut);background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;margin-top:8px}
.empty{color:var(--mut);padding:30px;text-align:center}

@media(max-width:860px){
  .appbar-inner{gap:10px;padding:0 12px;overflow-x:auto}
  .wrap{padding:20px 14px 50px}
  .sumband{grid-template-columns:1fr}
  .kpirow{grid-template-columns:1fr;gap:8px}
  .kpistat{text-align:left}
  .statline{gap:22px}
  .hbar{grid-template-columns:86px 1fr 48px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =============================================================================
   SSIM KPI DASHBOARD — SIC & SFT MENA (fully self-contained: no external
   libraries or fonts, so it works on restricted corporate networks)
   -----------------------------------------------------------------------------
   DATA SOURCE: data.csv in the SAME GitHub repository as this page.
   Subs edit data.csv on github.com (pencil icon > commit); GitHub Pages
   redeploys automatically and the dashboard updates itself.

   data.csv columns (one header row):
     subsidiary,cycle,kpi,value,target,plan,comment,updated
   - cycle  : the year. New years need NO code change — add rows with the new
              year and it appears in the selector; old years stay forever.
   - kpi    : code from the KPI guide (ST-01 ... ME-07, PG-01 ... PG-03)
   - value  : actual number (1/0 for yes-no). May stay blank on plan rows.
   - target : optional per-sub target for that year (PRL 9 for SETK, 8 for
              SEEG...). A target of 0 = "Not applicable", excluded from score.
   - plan   : what the subsidiary planned to do (shown under the KPI).
   - Last row wins if a KPI appears twice - append corrections at the bottom.
============================================================================= */
const CONFIG = { DATA_URL: "data.csv", TITLE: "SIC & SFT — MENA" };

/* --------------------------- SSIM definitions ----------------------------- */
const PILLARS = [
  {id:'ST',name:'Storytelling',weight:60,desc:'Communication with participants, external PR, internal comms and stakeholder feedback — the heaviest pillar in SSIM.'},
  {id:'SU',name:'Sustainable',weight:20,desc:'Government cooperation, NGO partnership, ethical guidelines and alumni continuity.'},
  {id:'IM',name:'Impactful',weight:10,desc:'Satisfaction, pre/post measurement and educational outcomes — measured through the CCO KPI files.'},
  {id:'ME',name:'Meaningful',weight:10,desc:'Local relevance, leadership and employee involvement, teachers, awards and external recognition.'},
  {id:'PG',name:'Program delivery',weight:0,desc:'Students, budget and delivery figures — context for the Compare page, not part of the SSIM score.'},
];
/* kind: 'num' = count against target - 'bool' = yes(1)/no(0) */
const KPIS = [
  {code:'ST-01',pillar:'ST',q:'Q1', name:'Two-way communication channel',kind:'bool',target:1,unit:'yes/no',desc:'Operate a two-way channel with participants all year (WhatsApp / Facebook community, website). Evidence: screenshots.'},
  {code:'ST-02',pillar:'ST',q:'Q2', name:'Alumni tracking after the program',kind:'bool',target:1,unit:'yes/no',desc:'Track participants 4-8 months after the program ends (survey, network, follow-up).'},
  {code:'ST-03',pillar:'ST',q:'Q3', name:'Posts on official social media',kind:'num',target:50,unit:'posts',desc:'Program content posted on the sub\u2019s official SNS. Full score at 50+ posts with links and channel names.'},
  {code:'ST-04',pillar:'ST',q:'Q3', name:'Official SNS channels used',kind:'num',target:2,unit:'channels',desc:'Use two or more of the sub\u2019s official channels (YouTube / Instagram / TikTok / Facebook).'},
  {code:'ST-05',pillar:'ST',q:'Q3', name:'Samsung Newsroom posts',kind:'num',target:2,unit:'posts',desc:'Program content posted on the subsidiary\u2019s Samsung Newsroom channel, two times or more.'},
  {code:'ST-06',pillar:'ST',q:'Q4', name:'External press coverage',kind:'num',target:4,unit:'articles',desc:'Program covered four times or more by external press media. Keep the list of links.'},
  {code:'ST-07',pillar:'ST',q:'Q4', name:'Event with external stakeholders',kind:'num',target:1,unit:'events',desc:'At least one event inviting external stakeholders (press event, ceremony with media).'},
  {code:'ST-08',pillar:'ST',q:'Q5', name:'Internal comms (Knox / newsletter)',kind:'num',target:1,unit:'posts',desc:'One or more posts on Knox Portal, internal newsletter or Newsroom per milestone.'},
  {code:'ST-09',pillar:'ST',q:'Q5', name:'Emails to employees',kind:'num',target:1,unit:'emails',desc:'One or more program emails sent to the subsidiary\u2019s employees (mentor call, results).'},
  {code:'ST-10',pillar:'ST',q:'Q5', name:'Internal employee events',kind:'num',target:1,unit:'events',desc:'One or more events targeting the sub\u2019s employees (town hall, training session, volunteering call).'},
  {code:'ST-11',pillar:'ST',q:'Q6', name:'PR plan before program start',kind:'bool',target:1,unit:'yes/no',desc:'A written, detailed PR plan with timeline exists BEFORE the program starts.'},
  {code:'ST-12',pillar:'ST',q:'Q7', name:'PR results improved vs last year',kind:'bool',target:1,unit:'yes/no',desc:'Measured PR results (reach, engagement, buzz, posts) improved compared to last year.'},
  {code:'ST-13',pillar:'ST',q:'Q8', name:'Stakeholder groups with feedback',kind:'num',target:5,unit:'groups',desc:'Collect raw feedback (name, title, quote) from all 5 groups: students, teachers/parents, government, NGOs/partners, employees.'},
  {code:'ST-14',pillar:'ST',q:'PRL',name:'PRLs published',kind:'num',target:5,unit:'PRLs',desc:'Press releases issued across the year. Recommended cadence: launch, partnership, mid-program milestone, graduation, impact story. Per-sub target set by CCO.'},
  {code:'ST-15',pillar:'ST',q:'BP', name:'Video content produced',kind:'num',target:1,unit:'videos',desc:'Video series on projects, stories and community impact (best practice from SEDA-S).'},
  {code:'SU-01',pillar:'SU',q:'Q11',name:'Official government agreement',kind:'bool',target:1,unit:'yes/no',desc:'Signed agreement (MOU) with key ministries, local government or affiliated organizations. Evidence: MOU document.'},
  {code:'SU-02',pillar:'SU',q:'Q12',name:'NGO partner performance documented',kind:'bool',target:1,unit:'yes/no',desc:'Main NGO named with evidenced strong contribution to the program.'},
  {code:'SU-03',pillar:'SU',q:'Q13',name:'Partner key-figure categories involved',kind:'num',target:4,unit:'categories',desc:'Key figures at events from: government officials, public organizations, NGO/partner members, school/education members.'},
  {code:'SU-04',pillar:'SU',q:'Q14',name:'Ethical guideline established',kind:'bool',target:1,unit:'yes/no',desc:'A local guideline protecting beneficiaries\u2019 rights and interests exists.'},
  {code:'SU-05',pillar:'SU',q:'Q15',name:'Ethical guideline implemented',kind:'bool',target:1,unit:'yes/no',desc:'Guideline actively used: ethics education/briefing provided to participants.'},
  {code:'SU-06',pillar:'SU',q:'Q18',name:'Alumni continuity actions',kind:'num',target:3,unit:'actions',desc:'Full score needs all three: past participants take part this year, alumni stories used as PR, and an alumni network / community.'},
  {code:'SU-07',pillar:'SU',q:'Q19',name:'Operational improvements',kind:'bool',target:1,unit:'yes/no',desc:'Documented improvements vs last year (tools, processes, on-time CCO reporting).'},
  {code:'IM-01',pillar:'IM',q:'Q20',name:'Satisfaction survey conducted',kind:'bool',target:1,unit:'yes/no',desc:'Participant satisfaction survey conducted and recorded in the CCO KPI sheet.'},
  {code:'IM-02',pillar:'IM',q:'Q21',name:'Satisfaction improved vs last year',kind:'bool',target:1,unit:'yes/no',desc:'Satisfaction level higher than last year, per the KPI sheet.'},
  {code:'IM-03',pillar:'IM',q:'Q22',name:'Pre/post measures tracked',kind:'num',target:3,unit:'measures',desc:'Measured through CCO KPI files: capability evaluation, course completion rate, employment rate.'},
  {code:'IM-04',pillar:'IM',q:'Q23',name:'Education hours per trainee',kind:'num',target:100,unit:'hours',desc:'100 or more hours of structured education provided to trainees.'},
  {code:'IM-05',pillar:'IM',q:'Q23',name:'Hackathon / capstone contest',kind:'bool',target:1,unit:'yes/no',desc:'At least one internal contest (hackathon or capstone) conducted.'},
  {code:'IM-06',pillar:'IM',q:'Q23',name:'Employee / expert mentoring',kind:'bool',target:1,unit:'yes/no',desc:'Employee or expert mentoring provided to participants.'},
  {code:'IM-07',pillar:'IM',q:'Q23',name:'Employment-support education',kind:'bool',target:1,unit:'yes/no',desc:'Additional education for employment support (CV workshops, interview prep, career guidance).'},
  {code:'IM-08',pillar:'IM',q:'Q24',name:'Educational outcomes improved',kind:'bool',target:1,unit:'yes/no',desc:'Key educational outcomes improved vs last year (capability / completion / employment).'},
  {code:'ME-01',pillar:'ME',q:'Q26',name:'Local needs reflected in design',kind:'bool',target:1,unit:'yes/no',desc:'Program design based on needs of key local stakeholders and beneficiaries.'},
  {code:'ME-02',pillar:'ME',q:'Q28',name:'Top management participation types',kind:'num',target:5,unit:'types',desc:'Full score: all five — jury, speaker, award presenter, video message, written message to participants.'},
  {code:'ME-03',pillar:'ME',q:'Q29',name:'Employees volunteering',kind:'num',target:5,unit:'employees',desc:'Employees participating (mentoring, jury, sessions, CV reviews). Per-sub target set by CCO. Log hours and stage.'},
  {code:'ME-04',pillar:'ME',q:'Q30',name:'Teacher orientation / education',kind:'bool',target:1,unit:'yes/no',desc:'Program introduction and ethics/behavior education provided to teachers and facilitators.'},
  {code:'ME-05',pillar:'ME',q:'Q31',name:'Stakeholder feedback incorporated',kind:'bool',target:1,unit:'yes/no',desc:'Feedback incorporated with documented positive outcomes (feedback > change > result).'},
  {code:'ME-06',pillar:'ME',q:'Q32',name:'External awards won',kind:'num',target:1,unit:'awards',desc:'Awards recognizing the program\u2019s achievements won this year.'},
  {code:'ME-07',pillar:'ME',q:'Q33',name:'External event presentations',kind:'num',target:1,unit:'events',desc:'Invited and participated at external events to present the program\u2019s achievements.'},
  {code:'PG-01',pillar:'PG',q:'Plan',name:'Students trained',kind:'num',target:0,unit:'students',desc:'Students trained in the year. Target = the plan agreed with CCO. Context metric, not part of the SSIM score.'},
  {code:'PG-02',pillar:'PG',q:'Plan',name:'Budget given ($k)',kind:'num',target:0,unit:'$k',desc:'Budget awarded for the year. Context metric for the Compare page.'},
  {code:'PG-03',pillar:'PG',q:'Plan',name:'Budget spent ($k)',kind:'num',target:0,unit:'$k',desc:'Budget actually spent. Context metric for the Compare page.'},
];
const SUBS = ['SGE','SETK SFT','SETK SIC','SELV','SESAR','SEPAK','SEIL','Iran','Morocco','Algeria','Tunisia','SEEG'];
const DEFAULT_CYCLES = ['2025','2026'];
const TIERS = [{tier:'A',min:85},{tier:'B',min:70},{tier:'C',min:50},{tier:'D',min:0}];
const YEARCOLORS=['#9AA0AC','#5C6FD6','#1428A0','#0E8A5F','#B96E00'];

/* ------------------------------ data layer ------------------------------- */
let ROWS=[]; let SOURCE='sample'; let LOADED_AT=null;

function parseCSV(text){
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=ch; }
    else{
      if(ch==='"')inQ=true;
      else if(ch===','){row.push(field);field='';}
      else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n')i++; row.push(field);field=''; if(row.some(c=>c!=='')) rows.push(row); row=[]; }
      else field+=ch;
    }
  }
  if(field!==''||row.length){row.push(field); if(row.some(c=>c!=='')) rows.push(row);}
  return rows;
}
function rowsFromCSV(text){
  const raw=parseCSV(text); if(raw.length<2)return [];
  const head=raw[0].map(h=>h.trim().toLowerCase());
  const idx=n=>head.indexOf(n);
  const iSub=idx('subsidiary'),iCy=idx('cycle'),iK=idx('kpi'),iV=idx('value'),iT=idx('target'),iP=idx('plan'),iC=idx('comment'),iU=idx('updated');
  if(iSub<0||iK<0||iV<0)return [];
  return raw.slice(1).map(r=>{
    const vRaw=(r[iV]||'').trim(), tRaw=iT>=0?(r[iT]||'').trim():'';
    return {subsidiary:(r[iSub]||'').trim(), cycle:(iCy>=0?(r[iCy]||'').trim():'')||'2026',
      kpi:(r[iK]||'').trim().toUpperCase(),
      value:vRaw===''?null:parseFloat(vRaw),
      target:tRaw===''?'':parseFloat(tRaw),
      plan:iP>=0?(r[iP]||'').trim():'',
      comment:iC>=0?(r[iC]||'').trim():'', updated:iU>=0?(r[iU]||'').trim():''};
  }).filter(r=>r.subsidiary&&r.kpi&&((r.value!==null&&!isNaN(r.value))||(r.target!==''&&!isNaN(r.target))||r.plan))
    .map(r=>({...r,value:(r.value!==null&&!isNaN(r.value))?r.value:null}));
}
async function loadData(){
  if(CONFIG.DATA_URL){
    try{
      const resp=await fetch(CONFIG.DATA_URL,{cache:'no-store'});
      if(resp.ok){
        const rows=rowsFromCSV(await resp.text());
        if(rows.length){ROWS=rows;SOURCE='sheet';LOADED_AT=new Date();return;}
      }
    }catch(e){/* fall back to sample */}
  }
  // tiny built-in preview so the file still shows something when opened locally
  ROWS=[
    {subsidiary:'SEEG',cycle:'2025',kpi:'ST-14',value:5,target:'',plan:'',comment:'2025 actual',updated:''},
    {subsidiary:'SEEG',cycle:'2026',kpi:'ST-14',value:1,target:8,plan:'Launch PRL published; partnership and graduation PRLs planned',comment:'',updated:''},
    {subsidiary:'SETK SIC',cycle:'2025',kpi:'ST-14',value:8,target:'',plan:'',comment:'2025 actual',updated:''},
    {subsidiary:'SETK SIC',cycle:'2026',kpi:'ST-14',value:5,target:9,plan:'Milestone communications planned through year-end',comment:'',updated:''},
  ];
  SOURCE='sample';LOADED_AT=new Date();
}
function allCycles(){
  const set=new Set(DEFAULT_CYCLES); ROWS.forEach(r=>set.add(r.cycle));
  return [...set].sort();
}

/* ------------------------------ scoring ---------------------------------- */
function subsForCycle(cycle){
  const inData=[...new Set(ROWS.filter(r=>r.cycle===cycle).map(r=>r.subsidiary))];
  return SUBS.filter(s=>inData.includes(s)).concat(inData.filter(s=>!SUBS.includes(s)));
}
function getEntry(sub,cycle,code){
  let found=null;
  for(const r of ROWS) if(r.subsidiary===sub&&r.cycle===cycle&&r.kpi===code) found=r;
  return found;
}
function kpiStatus(k,entry){
  const target=(entry&&entry.target!==''&&!isNaN(entry.target))?entry.target:k.target;
  const plan=entry?entry.plan:'';
  if(target<=0){
    return {pct:0,value:entry?entry.value:null,target,status:'na',plan,comment:entry&&entry.comment,updated:entry&&entry.updated};
  }
  if(!entry||entry.value===null) return {pct:0,value:null,target,status:'not_started',plan,comment:entry&&entry.comment,updated:entry&&entry.updated};
  const pct=Math.min(100,Math.round(entry.value/target*100));
  let status;
  if(k.kind==='bool') status=entry.value>=target?'completed':'missing';
  else if(pct>=100)status='completed'; else if(pct>=75)status='on_track';
  else if(pct>=50)status='attention'; else status='at_risk';
  return {pct,value:entry.value,target,status,plan,comment:entry.comment,updated:entry.updated};
}
function subScore(sub,cycle){
  let hasRow=ROWS.some(r=>r.subsidiary===sub&&r.cycle===cycle);
  const pillarPct={};const details=[];
  for(const p of PILLARS){
    const ks=KPIS.filter(k=>k.pillar===p.id);
    let n=0,acc=0;
    for(const k of ks){
      const st=kpiStatus(k,getEntry(sub,cycle,k.code));
      if(p.weight>0&&st.status!=='na'){n++;acc+=st.pct;}
      details.push({kpi:k,st});
    }
    pillarPct[p.id]=n?Math.round(acc/n):0;
  }
  if(!hasRow)return null;
  const total=Math.round(PILLARS.reduce((a,p)=>a+pillarPct[p.id]*p.weight,0)/100*10)/10;
  const pillars=PILLARS.filter(p=>p.weight>0).map(p=>({pillar:p,pct:pillarPct[p.id]}));
  const tier=TIERS.find(t=>total>=t.min).tier;
  return {sub,total,tier,pillars,details};
}
const STATUS_META={
  completed:{label:'Target met',cls:'ok'}, on_track:{label:'On track',cls:'ok'},
  attention:{label:'Needs attention',cls:'warn'}, at_risk:{label:'At risk',cls:'risk'},
  missing:{label:'Missing',cls:'risk'}, not_started:{label:'No data',cls:'idle'},
  na:{label:'N/A',cls:'idle'},
};
function pctClass(p){return p>=75?'c-ok':p>=50?'c-warn':p>0?'c-risk':'c-idle';}
function fillClass(s){return (s==='completed'||s==='on_track')?'f-ok':s==='attention'?'f-warn':(s==='at_risk'||s==='missing')?'f-risk':'f-idle';}
function barColor(p){return p>=75?'#0E8A5F':p>=50?'#B96E00':'#C8362B';}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtN(v){return (v===null||v===undefined||isNaN(v))?'—':(Math.round(v*10)/10).toLocaleString('en-US');}

/* ----------------------- self-drawn chart helpers ------------------------- */
function radarSVG(axes){ // axes:[{label,pct}]
  const cx=160,cy=135,R=92,N=axes.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const ring=r=>axes.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(',')).join(' ');
  let s=`<svg viewBox="0 0 320 280" role="img" aria-label="Pillar completion radar">`;
  for(const r of [23,46,69,92]) s+=`<polygon points="${ring(r)}" fill="none" stroke="#E4E6EC" stroke-width="1"/>`;
  axes.forEach((_,i)=>{const [x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E4E6EC"/>`;});
  s+=`<polygon points="${axes.map((a,i)=>pt(i,R*a.pct/100).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="rgba(20,40,160,.16)" stroke="#1428A0" stroke-width="2"/>`;
  axes.forEach((a,i)=>{const [x,y]=pt(i,R*a.pct/100);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="#1428A0"/>`;});
  axes.forEach((a,i)=>{
    const [x,y]=pt(i,R+22);
    const anchor=Math.abs(x-cx)<8?'middle':(x>cx?'start':'end');
    s+=`<text x="${x.toFixed(1)}" y="${(y+(y>cy?8:0)).toFixed(1)}" text-anchor="${anchor}" font-size="11.5" font-weight="700" fill="#1A1C23">${esc(a.label)}</text>`;
    s+=`<text x="${x.toFixed(1)}" y="${(y+(y>cy?8:0)+13).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="#5C6270">${a.pct}%</text>`;
  });
  return s+`</svg>`;
}
function groupedBars(groups,years,opts){ // groups:[{label,vals:{year:val|null}}]
  const o=opts||{}; const isPct=!!o.pct;
  let max=isPct?100:1;
  if(!isPct) groups.forEach(g=>years.forEach(y=>{const v=g.vals[y];if(v!==null&&v!==undefined&&v>max)max=v;}));
  const showVals=groups.length*years.length<=40;
  const legend=`<div class="gb-legend">${years.map((y,i)=>`<span><span class="sw" style="background:${YEARCOLORS[i%YEARCOLORS.length]}"></span>${esc(y)}</span>`).join('')}</div>`;
  const bars=groups.map(g=>`<div class="gb-group"><div class="gb-bars">${
    years.map((y,i)=>{
      const v=g.vals[y];
      if(v===null||v===undefined)return `<div class="gb-bar" style="height:2px;background:#F0F1F4" title="${esc(g.label)} ${esc(y)}: no data"></div>`;
      const h=Math.max(2,v/max*100);
      return `<div class="gb-bar" style="height:${h.toFixed(1)}%;background:${YEARCOLORS[i%YEARCOLORS.length]}" title="${esc(g.label)} ${esc(y)}: ${fmtN(v)}${isPct?'%':''}">${showVals?`<span class="gb-val">${fmtN(v)}${isPct?'%':''}</span>`:''}</div>`;
    }).join('')
  }</div><div class="gb-lbl">${esc(g.label)}</div></div>`).join('');
  return legend+`<div class="gb-scroll"><div class="gb" style="min-width:${groups.length*(years.length*20+42)}px">${bars}</div></div>`;
}

      </tr>`).join('')}</tbody>
    </table></div>
  </div>`:''}`;
}

/* ---- KPI guide ---- */
function renderGuide(m){
  m.innerHTML=`
  <div class="page-head"><h1>SSIM KPI guide</h1>
    <p>The SSIM survey requirements translated into trackable KPIs, grouped by pillar with the SSIM question reference.
    A subsidiary-specific target for a given year is set in data.csv's <code class="k">target</code> column
    (e.g. PRL target 9 for SETK, 8 for SEEG, 5 elsewhere). A target of 0 marks a KPI not applicable for that subsidiary.
    The <code class="k">plan</code> column holds what the subsidiary committed to do — it shows under each KPI on the subsidiary page.</p>
    ${sourceLine()}</div>
  ${PILLARS.map(p=>`<div class="panel">
    <h2>${esc(p.name)} <span style="font-weight:500;color:var(--mut);font-size:13px">· ${p.weight>0?p.weight+'% of the SSIM score':'context, not scored'}</span></h2>
    <div class="sub">${esc(p.desc)}</div>
    <table class="guide"><thead><tr><th style="width:80px">Code</th><th style="width:70px">SSIM</th><th style="width:220px">KPI</th><th>Full-score requirement & evidence</th><th style="width:120px">Default target</th></tr></thead>
    <tbody>${KPIS.filter(k=>k.pillar===p.id).map(k=>`<tr>
      <td><code class="k">${k.code}</code></td><td style="color:var(--mut)">${esc(k.q)}</td>
      <td style="font-weight:600">${esc(k.name)}</td>
      <td style="color:var(--mut)">${esc(k.desc)}</td>
      <td>${k.pillar==='PG'?'Per-sub plan':(k.kind==='bool'?'Yes (1)':`${k.target} ${esc(k.unit)}`)}</td></tr>`).join('')}
    </tbody></table></div>`).join('')}
  <div class="note"><strong>How updates work:</strong> edit <code class="k">data.csv</code> in the GitHub repository
  (open the file &gt; pencil icon &gt; change your rows &gt; Commit changes). The dashboard re-reads the file on every page load.
  <strong>New year:</strong> add rows with the new year in the cycle column — it appears in the year selector automatically and
  all previous years stay available. If a KPI appears twice for the same subsidiary and year, the last row wins, so corrections
  can simply be appended at the bottom of the file.</div>`;
}

/* ------------------------------ boot ------------------------------------- */
(async function(){
  await loadData();
  const withData=allCycles().filter(c=>ROWS.some(r=>r.cycle===c&&r.value!==null));
  if(withData.length && !withData.includes(state.cycle)) state.cycle=withData[withData.length-1];
  render();
})();
window.go=go; window.openSub=openSub; window.setMetric=setMetric;
</script>
